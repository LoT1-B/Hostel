<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ----- CONSTANTES -----
const COLORS = {

const BACKGROUND_IMAGES = Array.from({ length: 30 }, (_, index) => `images/image${String(index + 1).padStart(2, '0')}.jpg`);

const Icon = ({ icon, size = 18, style = {} }) =>
  React.createElement('span', {
    dangerouslySetInnerHTML: { __html: icon && icon.toSvg ? icon.toSvg(size) : '' },
    style: { display: 'inline-flex', verticalAlign: 'middle', ...style }
  });

const createIcon = (icon) => (props, style) => {
  const resolvedProps = typeof props === 'number' ? { size: props, style } : (props || {});
  const size = resolvedProps.size ?? resolvedProps.s ?? 18;
  const resolvedStyle = resolvedProps.style || style || {};
  return <Icon icon={icon} size={size} style={resolvedStyle} />;
};

const I = {
  BedDouble: createIcon(lucide.BedDouble),
  CalendarCheck: createIcon(lucide.CalendarCheck),
  Package: createIcon(lucide.Package),
  Users: createIcon(lucide.Users),
  LayoutGrid: createIcon(lucide.LayoutGrid),
  LogOut: createIcon(lucide.LogOut),
  Plus: createIcon(lucide.Plus),
  Trash2: createIcon(lucide.Trash2),
  Pencil: createIcon(lucide.Pencil),
  X: createIcon(lucide.X),
  KeyRound: createIcon(lucide.KeyRound),
  AlertTriangle: createIcon(lucide.AlertTriangle),
  CheckCircle2: createIcon(lucide.CheckCircle2),
  DoorOpen: createIcon(lucide.DoorOpen),
  DoorClosed: createIcon(lucide.DoorClosed),
  TrendingUp: createIcon(lucide.TrendingUp),
  Hotel: createIcon(lucide.Hotel),
  Wine: createIcon(lucide.Wine),
  Utensils: createIcon(lucide.UtensilsCrossed),
  ArrowDown: createIcon(lucide.ArrowDownCircle),
  ArrowUp: createIcon(lucide.ArrowUpCircle),
  ArrowRight: createIcon(lucide.ArrowRight),
  ClipboardList: createIcon(lucide.ClipboardList),
  History: createIcon(lucide.History),
  Moon: createIcon(lucide.Moon),
  Sun: createIcon(lucide.Sun),
  Cloud: createIcon(lucide.Cloud),
  Droplets: createIcon(lucide.Droplets),
  Wind: createIcon(lucide.Wind),
  Lock: createIcon(lucide.Lock),
  Ban: createIcon(lucide.Ban),
  Calendar: createIcon(lucide.Calendar),
  FileDown: createIcon(lucide.FileDown),
  Settings: createIcon(lucide.Settings),
  RotateCcw: createIcon(lucide.RotateCcw),

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const formatCurrency = (n) => Number(n || 0).toLocaleString() + ' FCFA';
const formatDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const formatDateLong = (d) => new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const addDays = (day, n) => { const d = new Date(day + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const isPastBoundary = (currentDay, boundary) => {
  const next = new Date(currentDay + 'T00:00:00');
  next.setDate(next.getDate() + 1);
  if (boundary === 'noon') next.setHours(12, 0, 0, 0);
  return new Date() >= next;
};
const getLowStockItems = (data) => {
  const items = [...(data.stockBoisson || []), ...(data.stockNourriture || [])];
  return items.filter(it => it.qty <= it.threshold);
};
const ROLE_LABEL = { manager: 'Manager', reception: 'Réceptionniste' };
const ROOM_STATUS = {
  available: { label: 'Disponible', color: COLORS.teal },
  occupied: { label: 'Occupée', color: COLORS.brick },
  maintenance: { label: 'Maintenance', color: COLORS.slate },
};
const STOCK_CATS = {
  boisson: { label: 'Boissons', icon: I.Wine },
  nourriture: { label: 'Nourriture', icon: I.Utensils },
};
const PERIODS = [
  { n: 7, label: 'Hebdomadaire', sub: '7 jours' },
  { n: 10, label: 'Décade', sub: '10 jours' },
  { n: 15, label: 'Quinzaine', sub: '15 jours' },
  { n: 30, label: 'Mensuel', sub: '30 jours' },
];
const STORAGE_KEY = 'villablanca:main';
const TOKEN_KEY = 'villablanca:token';

// ----- API HELPER -----
const API_BASE = (() => {
  const h = window.location.hostname;
  // Mode développement local
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return 'http://localhost:5000/api';
  // Mode production : GitHub Pages → Render
  if (h.includes('github.io') || h.includes('lot1-b')) return 'https://hostel-2v4z.onrender.com/api';
  // Même domaine (Render front+back ensemble)
  return '/api';
})();

let _apiToken = localStorage.getItem(TOKEN_KEY);

async function api(path, opts = {}) {
  const headers = { ...opts.headers };
  if (_apiToken) headers['Authorization'] = `Bearer ${_apiToken}`;
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); _apiToken = null; }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ msg: 'Erreur API' }));
    throw new Error(err.msg || `HTTP ${res.status}`);
  }
  return res.json();
}

async function loadAllFromApi() {
  const [
    rooms, reservations, stockBoisson, stockNourriture,
    users, closedDays, settings
  ] = await Promise.all([
    api('/rooms').catch(() => []),
    api('/reservations').catch(() => []),
    api('/stock/boisson').catch(() => []),
    api('/stock/nourriture').catch(() => []),
    api('/users').catch(() => []),
    api('/closed-days').catch(() => []),
    api('/settings').catch(() => ({ hotelName: 'Villa Blanca', dayBoundary: 'midnight' })),
  ]);
  return {
    settings,
    currentDay: new Date().toISOString().slice(0, 10),
    closedDays,
    rooms, reservations, stockBoisson, stockNourriture,
    movements: [],
    users,
  };
}

async function loginToApi(username, password) {
  const data = await api('/auth/login', {
    method: 'POST',
    body: JSON.stringify({ username, password }),
  });
  _apiToken = data.token;
  localStorage.setItem(TOKEN_KEY, data.token);
  return data.user;
}

// ----- DATA HELPERS -----
function stockStatus(item) {
  if (item.qty <= 0) return { label: 'Rupture', color: COLORS.brick, level: 2 };
  if (item.qty <= item.threshold) return { label: 'Stock bas', color: '#b8946e', level: 1 };
  return { label: 'OK', color: COLORS.teal, level: 0 };
}

function daySnapshot(data, day) {
  const rooms = data.rooms;
  const occupied = rooms.filter(r => r.status === 'occupied').length;
  const revenue = rooms.filter(r => r.status === 'occupied').reduce((s, r) => s + Number(r.price || 0), 0);
  const arrivals = data.reservations.filter(r => r.checkin === day).length;
  const departures = data.reservations.filter(r => r.checkout === day).length;
  const moves = data.movements.filter(m => m.day === day);
  const sumMove = (cat, type) => moves.filter(m => m.category === cat && m.type === type).reduce((s, m) => s + Number(m.qty || 0), 0);
  const lowStockCount = [...data.stockBoisson, ...data.stockNourriture].filter(s => stockStatus(s).level > 0).length;
  return {
    day,
    roomsTotal: rooms.length,
    occupied,
    occupancyRate: rooms.length ? Math.round((occupied / rooms.length) * 100) : 0,
    revenue,
    arrivals,
    departures,
    boissonEntrees: sumMove('boisson', 'entree'),
    boissonSorties: sumMove('boisson', 'sortie'),
    nourritureEntrees: sumMove('nourriture', 'entree'),
    nourritureSorties: sumMove('nourriture', 'sortie'),
    lowStockCount,
  };
}

  });

  }, []);

      if (hour >= 5 && hour < 11) {
        setWeather({ temperature: '24°', condition: 'Ensoleillé', icon: 'Sun', humidity: '65%', wind: '12 km/h' });
      } else if (hour >= 11 && hour < 16) {
        setWeather({ temperature: '26°', condition: 'Partiellement nuageux', icon: 'Cloud', humidity: '70%', wind: '10 km/h' });
      } else if (hour >= 16 && hour < 20) {
        setWeather({ temperature: '22°', condition: 'Dégagé', icon: 'Sun', humidity: '58%', wind: '14 km/h' });
      } else {
        setWeather({ temperature: '20°', condition: 'Nuit claire', icon: 'Moon', humidity: '72%', wind: '8 km/h' });
      }

    updateWeather();
    const weatherTimer = setInterval(updateWeather, 60000);
    return () => clearInterval(weatherTimer);
  }, []);

  const handleEnter = () => {
    setIsVisible(false);

  };

function LoginScreen({ users, onLogin, storageError, hotelName, onApiLogin, backgroundImage }) {

    e.preventDefault();
    setError('');

    // Essayer API d'abord
    if (onApiLogin) {
      setLoggingIn(true);
      try {
        const user = await onApiLogin(username.trim(), password);
        onLogin(user);
        setLoggingIn(false);
        return;
      } catch (e) {
        setLoggingIn(false);
        // Fallback local si API indisponible
        console.warn('API login failed, fallback local:', e.message);

    // Fallback : auth locale (seed data)
    const found = users.find(u => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password);

// ----- MODAL -----
function Modal({ title, onClose, children }) {
  useEffect(() => { const h = e => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);
  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100,
      background: 'rgba(30,27,22,0.2)', backdropFilter: 'blur(6px)', padding: '20px' }}>
      <div onClick={e => e.stopPropagation()} className="glass" style={{ width: '100%', maxWidth: '480px', borderRadius: '28px', padding: '28px', position: 'relative' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px' }}>
          <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '20px', fontWeight: 700 }}>{title}</span>
          <button onClick={onClose} style={{ width: '32px', height: '32px', borderRadius: '50%', border: 'none', background: 'rgba(0,0,0,0.04)', cursor: 'pointer' }}><I.X size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div style={{ marginBottom: '16px' }}>

function Table({ headers, rows }) {

}

  const [modal, setModal] = useState(null);
  const canManage = role === 'manager';
  const [draft, setDraft] = useState({ number: '', type: 'Simple', price: 15000, status: 'available' });

  useEffect(() => { if (modal) setDraft(modal.room || { number: '', type: 'Simple', price: 15000, status: 'available' }); }, [modal]);

  const save = async () => {
    if (!draft.number.trim()) { showToast('Le numéro de chambre est requis.', 'error'); return; }
    const price = Number(draft.price);
    let rooms;
    if (modal.mode === 'add') rooms = [...data.rooms, { ...draft, id: uid(), price }];
    else rooms = data.rooms.map(r => r.id === modal.room.id ? { ...draft, price } : r);
    await persist({ ...data, rooms });
    showToast(modal.mode === 'add' ? 'Chambre ajoutée.' : 'Chambre modifiée.');
    setModal(null);
  };
  const remove = async (room) => { await persist({ ...data, rooms: data.rooms.filter(r => r.id !== room.id) }); showToast('Chambre supprimée.'); };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div><span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Chambres</span>
          <div style={{ fontSize: '13px', color: COLORS.slate }}>{data.rooms.length} chambre{data.rooms.length !== 1 ? 's' : ''}</div>
        </div>
        {canManage && <button onClick={() => setModal({ mode: 'add', room: null })} className="btn btn-primary"><I.Plus size={16} /> Ajouter</button>}
      </div>
      <Table headers={['N°', 'Type', 'Prix', 'Statut', ...(canManage ? ['Actions'] : [])]} rows={data.rooms.map(r => ({
        id: r.id, cells: [
          <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontWeight: 600 }}>{r.number}</span>,
          <span>{r.type}</span>,
          <span style={{ fontWeight: 600, color: COLORS.brass }}>{formatCurrency(r.price)}</span>,
          <span className="tag" style={{ background: ROOM_STATUS[r.status].color, color: 'white' }}>{ROOM_STATUS[r.status].label}</span>,
          ...(canManage ? [(
            <div style={{ display: 'flex', gap: '4px' }}>
              <button onClick={() => setModal({ mode: 'edit', room: r })} className="btn-ghost" style={{ padding: '6px 8px', borderRadius: '10px', background: 'rgba(37,99,235,0.08)' }}><I.Pencil size={14} style={{ color: COLORS.brass }} /></button>
              <button onClick={() => remove(r)} className="btn-ghost" style={{ padding: '6px 8px', borderRadius: '10px', background: 'rgba(185,28,28,0.08)' }}><I.Trash2 size={14} style={{ color: COLORS.brick }} /></button>
            </div>
          )] : []),
        ]
      }))} />
      {modal && (
        <Modal title={modal.mode === 'add' ? 'Nouvelle chambre' : 'Modifier la chambre'} onClose={() => setModal(null)}>
          <Field label="Numéro"><input className="input" value={draft.number} onChange={e => setDraft({ ...draft, number: e.target.value })} placeholder="Ex: 401" /></Field>
          <Field label="Type"><input className="input" value={draft.type} onChange={e => setDraft({ ...draft, type: e.target.value })} placeholder="Simple, Suite…" /></Field>
          <Field label="Prix"><input type="number" className="input" value={draft.price} onChange={e => setDraft({ ...draft, price: e.target.value })} /></Field>
          <Field label="Statut">
            <select className="input" value={draft.status} onChange={e => setDraft({ ...draft, status: e.target.value })}>
              {Object.entries(ROOM_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </Field>
          <button onClick={save} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}><I.CheckCircle2 size={16} /> Enregistrer</button>
        </Modal>
      )}
    </div>
  );
}

const RES_STATUS = {
  booked: { label: 'Réservée', color: COLORS.brass },
  'checked-in': { label: 'Enregistrée', color: COLORS.teal },
  'checked-out': { label: 'Terminée', color: COLORS.slate },
  cancelled: { label: 'Annulée', color: COLORS.brick },
};

// ----- RESERVATIONS VIEW -----
function ReservationsView({ data, persist, showToast }) {
  const [modal, setModal] = useState(false);
  const [draft, setDraft] = useState({ guest: '', roomNumber: data.rooms[0]?.number || '', checkin: data.currentDay, checkout: data.currentDay, notes: '' });

  const createReservation = async () => {
    if (!draft.guest.trim() || !draft.roomNumber) { showToast('Nom du client et chambre requis.', 'error'); return; }
    await persist({ ...data, reservations: [...data.reservations, { ...draft, id: uid(), status: 'booked' }] });
    showToast('Réservation créée.');
    setModal(false);
    setDraft({ guest: '', roomNumber: data.rooms[0]?.number || '', checkin: data.currentDay, checkout: data.currentDay, notes: '' });
  };
  const checkIn = async (res) => {
    await persist({ ...data,
      reservations: data.reservations.map(r => r.id === res.id ? { ...r, status: 'checked-in' } : r),
      rooms: data.rooms.map(rm => rm.number === res.roomNumber ? { ...rm, status: 'occupied' } : rm) });
    showToast(`${res.guest} enregistré(e) en chambre ${res.roomNumber}.`);
  };
  const checkOut = async (res) => {
    await persist({ ...data,
      reservations: data.reservations.map(r => r.id === res.id ? { ...r, status: 'checked-out' } : r),
      rooms: data.rooms.map(rm => rm.number === res.roomNumber ? { ...rm, status: 'available' } : rm) });
    showToast(`Chambre ${res.roomNumber} libérée.`);
  };
  const cancel = async (res) => { await persist({ ...data, reservations: data.reservations.map(r => r.id === res.id ? { ...r, status: 'cancelled' } : r) }); showToast('Réservation annulée.'); };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div><span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Réservations</span>
          <div style={{ fontSize: '13px', color: COLORS.slate }}>{data.reservations.length} au total</div>
        </div>
        <button onClick={() => setModal(true)} className="btn btn-primary"><I.Plus size={16} /> Nouvelle</button>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {data.reservations.length === 0 && <div style={{ fontSize: '14px', color: COLORS.slate }}>Aucune réservation.</div>}
        {data.reservations.slice().reverse().map(r => (
          <div key={r.id} className="glass" style={{ padding: '16px 20px', borderRadius: '16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontWeight: 600 }}>{r.guest}</div>
              <div style={{ fontSize: '12px', color: COLORS.slate, marginTop: '2px' }}>
                Chambre {r.roomNumber} · {formatDate(r.checkin)} → {formatDate(r.checkout)}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span className="tag" style={{ background: RES_STATUS[r.status].color, color: 'white' }}>{RES_STATUS[r.status].label}</span>
              {r.status === 'booked' && (<>
                <button onClick={() => checkIn(r)} className="btn btn-success" style={{ padding: '6px 12px', fontSize: '12px' }}><I.DoorOpen size={13} /> Check-in</button>
                <button onClick={() => cancel(r)} className="btn-ghost" style={{ fontSize: '12px', color: COLORS.brick, padding: '6px 10px', background: 'rgba(185,28,28,0.08)' }}>Annuler</button>
              </>)}
              {r.status === 'checked-in' && <button onClick={() => checkOut(r)} className="btn btn-danger" style={{ padding: '6px 12px', fontSize: '12px' }}><I.DoorClosed size={13} /> Check-out</button>}
            </div>
          </div>
        ))}
      </div>
      {modal && (
        <Modal title="Nouvelle réservation" onClose={() => setModal(false)}>
          <Field label="Nom du client"><input className="input" value={draft.guest} onChange={e => setDraft({ ...draft, guest: e.target.value })} /></Field>
          <Field label="Chambre">
            <select className="input" value={draft.roomNumber} onChange={e => setDraft({ ...draft, roomNumber: e.target.value })}>
              {data.rooms.map(r => <option key={r.id} value={r.number}>{r.number} — {r.type}</option>)}
            </select>
          </Field>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <Field label="Arrivée"><input type="date" className="input" value={draft.checkin} onChange={e => setDraft({ ...draft, checkin: e.target.value })} /></Field>
            <Field label="Départ"><input type="date" className="input" value={draft.checkout} onChange={e => setDraft({ ...draft, checkout: e.target.value })} /></Field>
          </div>
          <Field label="Notes"><input className="input" value={draft.notes} onChange={e => setDraft({ ...draft, notes: e.target.value })} /></Field>
          <button onClick={createReservation} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}><I.CheckCircle2 size={16} /> Créer</button>
        </Modal>
      )}
    </div>
  );
}

// ----- STOCK VIEW -----
function StockView({ data, persist, role, showToast }) {
  const [cat, setCat] = useState('boisson');
  const [modal, setModal] = useState(null);
  const [moveModal, setMoveModal] = useState(null);
  const [draft, setDraft] = useState({ name: '', qty: 0, unit: 'pcs', threshold: 5 });
  const [moveQty, setMoveQty] = useState(1);
  const [undoStack, setUndoStack] = useState([]);
  const canManage = role === 'manager';
  const listKey = cat === 'boisson' ? 'stockBoisson' : 'stockNourriture';
  const list = data[listKey];

  useEffect(() => {
    if (modal?.mode === 'edit') setDraft(modal.item);
    if (modal?.mode === 'add') setDraft({ name: '', qty: 0, unit: 'pcs', threshold: 5 });
  }, [modal]);
  useEffect(() => { setMoveQty(1); }, [moveModal]);

  const save = async () => {
    if (!draft.name.trim()) { showToast('Le nom est requis.', 'error'); return; }
    const clean = { ...draft, qty: Number(draft.qty), threshold: Number(draft.threshold) };
    let list2;
    if (modal.mode === 'add') list2 = [...list, { ...clean, id: uid() }];
    else list2 = list.map(s => s.id === modal.item.id ? clean : s);
    setUndoStack(prev => [list, ...prev].slice(0, 10));
    await persist({ ...data, [listKey]: list2 });
    showToast('Stock mis à jour.');
    setModal(null);
  };
  const remove = async (item) => {
    setUndoStack(prev => [list, ...prev].slice(0, 10));
    await persist({ ...data, [listKey]: list.filter(s => s.id !== item.id) });
    showToast('Article supprimé.');
  };

  const undo = async () => {
    if (!undoStack.length) return;
    const [prev, ...rest] = undoStack;
    setUndoStack(rest);
    await persist({ ...data, [listKey]: prev });
    showToast('Dernière action annulée.');
  };

  const doMove = async () => {
    const qty = Number(moveQty);
    if (!qty || qty <= 0) { showToast('Quantité invalide.', 'error'); return; }
    const item = moveModal.item, type = moveModal.type;
    if (type === 'sortie' && qty > item.qty) { showToast(`Stock insuffisant (${item.qty} ${item.unit}).`, 'error'); return; }
    const newQty = type === 'entree' ? item.qty + qty : item.qty - qty;
    const list2 = list.map(s => s.id === item.id ? { ...s, qty: newQty } : s);
    const movement = { id: uid(), category: cat, itemId: item.id, itemName: item.name, type, qty, day: data.currentDay, time: new Date().toISOString() };
    setUndoStack(prev => [list, ...prev].slice(0, 10));
    await persist({ ...data, [listKey]: list2, movements: [...data.movements, movement] });
    showToast(type === 'entree' ? `Entrée : +${qty} ${item.unit} de ${item.name}.` : `Sortie : -${qty} ${item.unit} de ${item.name}.`);
    setMoveModal(null);
  };

  const todaysMoves = data.movements.filter(m => m.day === data.currentDay && m.category === cat).slice().reverse();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div><span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Stock</span>
          <div style={{ fontSize: '13px', color: COLORS.slate }}>Boissons et nourriture</div>
        </div>
        {canManage && <button onClick={() => setModal({ mode: 'add' })} className="btn btn-primary"><I.Plus size={16} /> Ajouter</button>}
        {undoStack.length > 0 && (
          <button onClick={undo} className="btn-ghost" style={{ padding: '10px 16px', borderRadius: '14px', color: COLORS.brick, border: `1.5px solid rgba(190,60,55,0.15)`, fontSize: '13px' }}>
            <I.RotateCcw size={14} /> Annuler
          </button>
        )}
      </div>

      <div style={{ display: 'flex', gap: '8px' }}>
        {Object.entries(STOCK_CATS).map(([k, v]) => (
          <button key={k} className={'subtab' + (cat === k ? ' active' : '')} onClick={() => setCat(k)}>
            {React.createElement(v.icon, {}, null)} {v.label}
          </button>
        ))}
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {list.map(s => {
          const st = stockStatus(s);
          const pct = s.threshold > 0 ? (s.qty / (s.threshold * 2)) * 100 : 100;
          return (
            <div key={s.id} className="glass" style={{ padding: '14px 18px', borderRadius: '16px', display: 'flex', alignItems: 'center', gap: '14px' }}>
              <div style={{ width: '36px', height: '36px', borderRadius: '9px', background: st.level > 0 ? 'rgba(176,90,74,0.08)' : 'rgba(61,122,107,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <I.Package size={16} style={{ color: st.level > 0 ? COLORS.brick : COLORS.teal }} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: '14px' }}>{s.name}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '4px' }}>
                  <div style={{ flex: 1, maxWidth: '180px', height: '5px', borderRadius: '3px', background: 'rgba(0,0,0,0.06)', overflow: 'hidden' }}>
                    <div style={{ width: `${Math.max(0, Math.min(100, pct))}%`, height: '100%', borderRadius: '3px', background: st.level > 0 ? COLORS.brick : COLORS.teal }} />
                  </div>
                  <span className="tag" style={{ background: st.color, color: 'white', fontSize: '10px' }}>{st.label}</span>
                  <span style={{ fontSize: '12px', color: COLORS.slate }}>{s.qty} / {s.threshold} {s.unit}</span>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '4px', flexShrink: 0 }}>
                <button onClick={() => setMoveModal({ item: s, type: 'entree' })} className="btn btn-success" style={{ padding: '4px 10px', fontSize: '11px' }}><I.ArrowDown size={12} /></button>
                <button onClick={() => setMoveModal({ item: s, type: 'sortie' })} className="btn btn-danger" style={{ padding: '4px 10px', fontSize: '11px' }}><I.ArrowUp size={12} /></button>
                {canManage && (<>
                  <button onClick={() => setModal({ mode: 'edit', item: s })} className="btn-ghost" style={{ padding: '6px 7px', borderRadius: '10px', background: 'rgba(37,99,235,0.08)' }}><I.Pencil size={13} style={{ color: COLORS.brass }} /></button>
                  <button onClick={() => remove(s)} className="btn-ghost" style={{ padding: '6px 7px', borderRadius: '10px', background: 'rgba(185,28,28,0.08)' }}><I.Trash2 size={13} style={{ color: COLORS.brick }} /></button>
                </>)}
              </div>
            </div>
          );
        })}
        {list.length === 0 && <div style={{ fontSize: '14px', color: COLORS.slate }}>Aucun article.</div>}
      </div>

      <div>
        <div style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '16px', fontWeight: 600, marginBottom: '10px' }}>Mouvements du jour — {STOCK_CATS[cat].label}</div>
        {todaysMoves.length === 0 ? (
          <div style={{ fontSize: '13px', color: COLORS.slate }}>Aucun mouvement aujourd'hui.</div>
        ) : (
          <Table headers={['Article', 'Type', 'Quantité', 'Heure']} rows={todaysMoves.map(m => ({
            id: m.id, cells: [
              <span>{m.itemName}</span>,
              <span className="tag" style={{ background: m.type === 'entree' ? COLORS.teal : COLORS.brick, color: 'white', fontSize: '10px' }}>{m.type === 'entree' ? 'Entrée' : 'Sortie'}</span>,
              <span style={{ fontFamily: 'Space Grotesk, sans-serif' }}>{m.qty}</span>,
              <span style={{ fontSize: '12px', color: COLORS.slate }}>{new Date(m.time).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span>,
            ]
          }))} />
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === 'add' ? 'Nouvel article' : 'Modifier'} onClose={() => setModal(null)}>
          <Field label="Nom"><input className="input" value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} /></Field>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <Field label="Quantité"><input type="number" className="input" value={draft.qty} onChange={e => setDraft({ ...draft, qty: e.target.value })} /></Field>
            <Field label="Unité"><input className="input" value={draft.unit} onChange={e => setDraft({ ...draft, unit: e.target.value })} placeholder="pcs, kg…" /></Field>
          </div>
          <Field label="Seuil"><input type="number" className="input" value={draft.threshold} onChange={e => setDraft({ ...draft, threshold: e.target.value })} /></Field>
          <button onClick={save} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}><I.CheckCircle2 size={16} /> Enregistrer</button>
        </Modal>
      )}

      {moveModal && (
        <Modal title={(moveModal.type === 'entree' ? 'Entrée — ' : 'Sortie — ') + moveModal.item.name} onClose={() => setMoveModal(null)}>
          <Field label={`Quantité (${moveModal.item.unit}) — disponible : ${moveModal.item.qty}`}>
            <input type="number" min="1" className="input" value={moveQty} onChange={e => setMoveQty(e.target.value)} autoFocus />
          </Field>
          <button onClick={doMove} className={'btn ' + (moveModal.type === 'entree' ? 'btn-success' : 'btn-danger')} style={{ width: '100%', justifyContent: 'center', padding: '12px' }}>
            {moveModal.type === 'entree' ? <I.ArrowDown size={16} /> : <I.ArrowUp size={16} />} Confirmer
          </button>
        </Modal>
      )}
    </div>
  );
}

// ----- CUMULS VIEW -----
function CumulsView({ data }) {
  const [period, setPeriod] = useState(7);
  const [customMode, setCustomMode] = useState(false);
  const [dateStart, setDateStart] = useState(addDays(todayStr(), -30));
  const [dateEnd, setDateEnd] = useState(todayStr());
  const [exporting, setExporting] = useState(false);

  // Filtrer les jours selon le mode
  const days = customMode
    ? data.closedDays.filter(d => d.day >= dateStart && d.day <= dateEnd)
    : data.closedDays.slice(-period);

  const sum = (key) => days.reduce((s, d) => s + Number(d[key] || 0), 0);
  const avgOcc = days.length ? Math.round(days.reduce((s, d) => s + d.occupancyRate, 0) / days.length) : 0;

  // ——— EXPORT EXCEL ———
  const exportExcel = () => {
    if (!window.XLSX || days.length === 0) return;
    setExporting(true);
    try {
      const rows = days.map(d => ({
        Date: formatDate(d.day),
        Occupation: `${d.occupancyRate}%`,
        'Occupées': `${d.occupied}/${d.roomsTotal}`,
        Revenu: d.revenue,
        Arrivées: d.arrivals,
        Départs: d.departures,
        'Boissons (E)': d.boissonEntrees,
        'Boissons (S)': d.boissonSorties,
        'Nourriture (E)': d.nourritureEntrees,
        'Nourriture (S)': d.nourritureSorties,
        'Alertes stock': d.lowStockCount,
      }));
      // Ligne des totaux
      rows.push({
        Date: 'TOTAL',
        Occupation: `${avgOcc}%`,
        'Occupées': '',
        Revenu: sum('revenue'),
        Arrivées: sum('arrivals'),
        Départs: sum('departures'),
        'Boissons (E)': sum('boissonEntrees'),
        'Boissons (S)': sum('boissonSorties'),
        'Nourriture (E)': sum('nourritureEntrees'),
        'Nourriture (S)': sum('nourritureSorties'),
        'Alertes stock': sum('lowStockCount'),
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Cumuls');
      XLSX.writeFile(wb, `VillaBlanca_Cumuls_${dateStart}_${dateEnd}.xlsx`);
    } finally { setExporting(false); }
  };

  // ——— EXPORT WORD ———
  const exportWord = () => {
    if (days.length === 0) return;
    const rowsHtml = [...days].reverse().map(d => `
      <tr>
        <td>${formatDate(d.day)}</td>
        <td style="text-align:center">${d.occupancyRate}%</td>
        <td style="text-align:center">${d.occupied}/${d.roomsTotal}</td>
        <td style="text-align:right">${d.revenue.toLocaleString()} FCFA</td>
        <td style="text-align:center">${d.arrivals} / ${d.departures}</td>
        <td style="text-align:center">${d.boissonEntrees} / ${d.boissonSorties}</td>
        <td style="text-align:center">${d.nourritureEntrees} / ${d.nourritureSorties}</td>
        <td style="text-align:center">${d.lowStockCount}</td>
      </tr>
    `).join('');

    const html = `<!DOCTYPE html>

function StatCard({ label, value, sub, color, icon }) {
  const IconComp = icon;
  return (
    <div className="glass card-hover" style={{ padding: '16px 18px', borderRadius: '20px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '6px' }}>
        <span style={{ fontSize: '10px', fontWeight: 600, color: COLORS.slate, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</span>
        {IconComp && <IconComp size={16} style={{ color: color || COLORS.slate, opacity: 0.5 }} />}
      </div>
      <div className="stat-number" style={{ fontSize: '24px', color: color || COLORS.ink, lineHeight: 1.2 }}>{value}</div>
      {sub && <div style={{ fontSize: '11px', color: COLORS.slate, marginTop: '2px' }}>{sub}</div>}
    </div>
  );
}

// ----- CLOTURE VIEW -----
function ClotureView({ data, persist, showToast, currentUser }) {
  const [confirming, setConfirming] = useState(false);
  const snap = daySnapshot(data, data.currentDay);
  const dueClosure = isPastBoundary(data.currentDay, data.settings.dayBoundary);
  const todayLocked = data.closedDays.find(d => d.day === data.currentDay)?.locked;

  const closeDay = async () => {
    const record = {
      ...snap,
      closedAt: new Date().toISOString(),
      locked: true,
      closedBy: currentUser?.username || 'inconnu',
    };
    const closedDays = [...data.closedDays, record];
    const nextDay = addDays(data.currentDay, 1);
    await persist({ ...data, closedDays, currentDay: nextDay });
    showToast(
      `✅ Journée du ${formatDate(snap.day)} clôturée par ${currentUser?.name}.`
    );
    setConfirming(false);
  };

  const setBoundary = async (val) => {
    await persist({ ...data, settings: { ...data.settings, dayBoundary: val } });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
      <div>
        <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Clôture du jour</span>
        <div style={{ fontSize: '13px', color: COLORS.slate }}>{formatDateLong(data.currentDay)}</div>
      </div>

      {todayLocked && (
        <div className="glass" style={{ padding: '12px 18px', borderRadius: '16px', display: 'flex', alignItems: 'center', gap: '10px', color: COLORS.teal, borderColor: COLORS.teal, background: 'rgba(40,160,120,0.08)' }}>
          <I.Lock size={16} /> Cette journée est déjà clôturée et verrouillée.
        </div>
      )}

      {dueClosure && (
        <div className="glass" style={{ padding: '12px 18px', borderRadius: '16px', display: 'flex', alignItems: 'center', gap: '10px', color: '#b8946e', borderColor: '#b8946e' }}>
          <I.AlertTriangle size={16} /> Le seuil de bascule est dépassé.
        </div>
      )}

      <div className="glass" style={{ padding: '20px', borderRadius: '24px' }}>
        <div style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '16px', fontWeight: 600, marginBottom: '14px', display: 'flex', alignItems: 'center', gap: '8px' }}>
          <I.Lock size={16} /> Aperçu avant clôture
          <span style={{ fontSize: '11px', color: COLORS.brick, fontWeight: 400 }}>— irréversible</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px,1fr))', gap: '12px' }}>
          <StatCard label="Occupation" value={snap.occupancyRate + '%'} sub={`${snap.occupied}/${snap.roomsTotal}`} color={COLORS.teal} />
          <StatCard label="Revenu" value={formatCurrency(snap.revenue)} color={COLORS.brass} />
          <StatCard label="Arrivées/Départs" value={`${snap.arrivals}/${snap.departures}`} color={COLORS.slate} />
          <StatCard label="Alertes stock" value={snap.lowStockCount} color={COLORS.brick} />
        </div>
        {!todayLocked && (
          <button onClick={() => setConfirming(true)} className="btn btn-primary" style={{ marginTop: '18px', padding: '12px 24px' }}>
            <I.Lock size={16} /> Clôturer la journée
          </button>
        )}
      </div>

      <div className="glass" style={{ padding: '20px', borderRadius: '24px' }}>
        <div style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '16px', fontWeight: 600, marginBottom: '14px' }}>Bascule</div>
        <div style={{ display: 'flex', gap: '10px' }}>
          <button onClick={() => setBoundary('midnight')} className={'subtab' + (data.settings.dayBoundary === 'midnight' ? ' active' : '')}><I.Moon size={14} /> Minuit</button>
          <button onClick={() => setBoundary('noon')} className={'subtab' + (data.settings.dayBoundary === 'noon' ? ' active' : '')}><I.Sun size={14} /> Midi</button>
        </div>
      </div>

      <div>
        <div style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '16px', fontWeight: 600, marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px' }}>
          <I.History size={16} /> Historique
        </div>
        {data.closedDays.length === 0 ? (
          <div style={{ fontSize: '13px', color: COLORS.slate }}>Aucune clôture.</div>
        ) : (
          <Table headers={['Date', 'Occupation', 'Revenu', 'Arr./Dép.', 'Alertes', 'Responsable']} rows={data.closedDays.slice().reverse().map(d => ({
            id: d.day, cells: [
              <span style={{ fontWeight: 500, display: 'flex', alignItems: 'center', gap: '6px' }}>
                {d.locked && <I.Lock size={11} style={{ color: COLORS.slate }} />}
                {formatDate(d.day)}
              </span>,
              <span>{d.occupancyRate}%</span>,
              <span style={{ fontWeight: 600, color: COLORS.brass }}>{formatCurrency(d.revenue)}</span>,
              <span>{d.arrivals} / {d.departures}</span>,
              <span className="tag" style={{ background: d.lowStockCount > 0 ? COLORS.brick : COLORS.teal, color: 'white', fontSize: '10px' }}>{d.lowStockCount}</span>,
              <span style={{ fontSize: '12px', color: COLORS.slate }}>{d.closedBy || '—'}</span>,
            ]
          }))} />
        )}
      </div>

      {confirming && !todayLocked && (
        <Modal title="Confirmer la clôture" onClose={() => setConfirming(false)}>
          <div style={{ fontSize: '14px', lineHeight: 1.6, marginBottom: '18px' }}>
            Clôturer la journée du <strong>{formatDate(data.currentDay)}</strong>.<br />
            <span style={{ color: COLORS.brick, fontWeight: 600 }}>
              ⚠ Cette action est irréversible.
            </span><br /><br />
            Responsable : <strong>{currentUser?.name}</strong> ({currentUser?.username})
          </div>
          <button onClick={closeDay} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}>
            <I.CheckCircle2 size={16} /> Confirmer
          </button>
        </Modal>
      )}
    </div>
  );
}

// ----- USERS VIEW -----
function UsersView({ data, persist, currentUser, showToast }) {
  const [modal, setModal] = useState(false);
  const [draft, setDraft] = useState({ username: '', password: '', role: 'reception', name: '' });

  const create = async () => {
    if (!draft.username.trim() || !draft.password.trim() || !draft.name.trim()) { showToast('Tous les champs sont requis.', 'error'); return; }
    if (data.users.some(u => u.username.toLowerCase() === draft.username.toLowerCase())) { showToast('Identifiant déjà existant.', 'error'); return; }
    await persist({ ...data, users: [...data.users, draft] });
    showToast('Utilisateur créé.');
    setModal(false);
    setDraft({ username: '', password: '', role: 'reception', name: '' });
  };
  const remove = async (u) => {
    if (u.username === currentUser.username) { showToast('Vous ne pouvez pas supprimer votre compte.', 'error'); return; }
    await persist({ ...data, users: data.users.filter(x => x.username !== u.username) });
    showToast('Utilisateur supprimé.');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div><span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Utilisateurs</span>
          <div style={{ fontSize: '13px', color: COLORS.slate }}>{data.users.length} compte{data.users.length !== 1 ? 's' : ''}</div>
        </div>
        <button onClick={() => setModal(true)} className="btn btn-primary"><I.Plus size={16} /> Ajouter</button>
      </div>
      <Table headers={['Nom', 'Identifiant', 'Rôle', 'Actions']} rows={data.users.map(u => ({
        id: u.username, cells: [
          <span style={{ fontWeight: 500 }}>{u.name}</span>,
          <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '13px' }}>{u.username}</span>,
          <span className="tag" style={{ background: 'rgba(0,0,0,0.04)', color: COLORS.ink }}>{ROLE_LABEL[u.role]}</span>,
          <button onClick={() => remove(u)} className="btn-ghost" style={{ padding: '6px 7px', borderRadius: '10px', background: 'rgba(185,28,28,0.08)' }}><I.Trash2 size={14} style={{ color: COLORS.brick }} /></button>,
        ]
      }))} />
      {modal && (
        <Modal title="Nouvel utilisateur" onClose={() => setModal(false)}>
          <Field label="Nom"><input className="input" value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} /></Field>
          <Field label="Identifiant"><input className="input" value={draft.username} onChange={e => setDraft({ ...draft, username: e.target.value })} /></Field>
          <Field label="Mot de passe"><input type="password" className="input" value={draft.password} onChange={e => setDraft({ ...draft, password: e.target.value })} /></Field>
          <Field label="Rôle">
            <select className="input" value={draft.role} onChange={e => setDraft({ ...draft, role: e.target.value })}>
              <option value="manager">Manager</option>
              <option value="reception">Réceptionniste</option>
            </select>
          </Field>
          <button onClick={create} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}><I.Users size={16} /> Créer</button>
        </Modal>
      )}
    </div>
  );
}

// ----- PARAMETRES -----
function SettingsView({ data, persist, currentUser, showToast }) {
  const [draftUser, setDraftUser] = useState({ ...currentUser });
  const [newPwd, setNewPwd] = useState('');
  const [newPwd2, setNewPwd2] = useState('');
  const [newDay, setNewDay] = useState(data.currentDay || todayStr());

  const saveUser = async () => {
    if (!draftUser.name.trim() || !draftUser.username.trim()) {
      showToast('Nom et identifiant requis.', 'error'); return;
    }
    if (draftUser.username !== currentUser.username &&
        data.users.some(u => u.username === draftUser.username)) {
      showToast('Identifiant déjà pris.', 'error'); return;
    }
    if (newPwd && newPwd !== newPwd2) {
      showToast('Les mots de passe ne correspondent pas.', 'error'); return;
    }
    const updated = { ...draftUser };
    if (newPwd) updated.password = newPwd;
    await persist({
      ...data,
      currentDay: newDay,
      users: data.users.map(u => u.username === currentUser.username ? updated : u),
    });
    Object.assign(currentUser, updated);
    showToast('Paramètres enregistrés.');
    setNewPwd(''); setNewPwd2('');
  };

  const field = (label, val, setter, type = 'text') => (
    <div>
      <label style={{ fontSize: '12px', color: COLORS.slate, marginBottom: '4px', display: 'block' }}>{label}</label>
      <input type={type} value={val} onChange={e => setter(e.target.value)}
        style={{ width: '100%', padding: '12px 14px', borderRadius: '14px', border: `1.5px solid rgba(0,0,0,0.06)`,
          fontSize: '14px', background: 'white', outline: 'none', boxSizing: 'border-box',
          transition: 'border-color 0.2s, box-shadow 0.2s' }}
        onFocus={e => { e.target.style.borderColor = COLORS.brass; e.target.style.boxShadow = `0 0 0 3px ${COLORS.brass}20`; }}
        onBlur={e => { e.target.style.borderColor = 'rgba(0,0,0,0.06)'; e.target.style.boxShadow = 'none'; }} />
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
      <div><span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '24px', fontWeight: 700 }}>Paramètres</span>
        <div style={{ fontSize: '13px', color: COLORS.slate }}>Gérer votre compte et la date de travail</div>
      </div>
      <div className="glass" style={{ padding: '24px', borderRadius: '24px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
        <span style={{ fontSize: '15px', fontWeight: 600 }}>Mon compte</span>
        {field('Nom complet', draftUser.name, v => setDraftUser({...draftUser, name: v}))}
        {field('Identifiant', draftUser.username, v => setDraftUser({...draftUser, username: v}))}
        {field('Nouveau mot de passe (laisser vide pour garder)', newPwd, setNewPwd, 'password')}
        {field('Confirmer le mot de passe', newPwd2, setNewPwd2, 'password')}
      </div>
      <div className="glass" style={{ padding: '24px', borderRadius: '24px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
        <span style={{ fontSize: '15px', fontWeight: 600 }}>Date de travail</span>
        {field('Jour courant', newDay, v => setNewDay(v), 'date')}
      </div>
      <div>
        <button onClick={saveUser} className="btn btn-primary" style={{ background: COLORS.teal }}>
          <I.CheckCircle2 size={16} /> Enregistrer
        </button>
      </div>
    </div>
  );
}

// ----- APP PRINCIPALE -----
function HotelManager() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [storageError, setStorageError] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState('dashboard');
  const [hoveredNav, setHoveredNav] = useState(null);
  const [toast, setToast] = useState(null);
  const [showSplash, setShowSplash] = useState(true);
  const [apiMode, setApiMode] = useState(false);
  const [backgroundIndex, setBackgroundIndex] = useState(0);

  useEffect(() => {
    if (showSplash) {
      setBackgroundIndex(prev => (prev + 1) % BACKGROUND_IMAGES.length);
    }
  }, [showSplash]);

  useEffect(() => {
    if (showSplash) return;

    let timer = null;
    const resetTimer = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        setShowSplash(true);
      }, 30 * 60 * 1000);
    };

    const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'];
    events.forEach(event => window.addEventListener(event, resetTimer, { passive: true }));

    resetTimer();

    return () => {
      if (timer) clearTimeout(timer);
      events.forEach(event => window.removeEventListener(event, resetTimer));
    };
  }, [showSplash]);

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        // Essayer API d'abord si on a un token
        if (_apiToken) {
          try {
            const apiData = await loadAllFromApi();
            if (!mounted) return;
            setApiMode(true);
            setData(apiData);
            setLoading(false);
            return;
          } catch (e) {
            console.warn('API chargement échoué, fallback local:', e.message);
          }
        }
        // Fallback : localStorage ou seedData
        const result = await window.storage.get(STORAGE_KEY, true);
        if (!mounted) return;
        if (result && result.value) setData(JSON.parse(result.value));
        else { const seeded = seedData(); await window.storage.set(STORAGE_KEY, JSON.stringify(seeded), true); setData(seeded); }
      } catch (e) {
        const seeded = seedData();
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(seeded), true); setData(seeded); }
        catch (e2) { setStorageError(true); setData(seeded); }
      } finally { if (mounted) setLoading(false); }
    })();
    return () => { mounted = false; };
  }, []);

  const syncToApi = useCallback(async (next) => {
    if (!apiMode) return;
    const prev = data;
    if (!prev || !next) return;

    // Détecter et synchroniser les changements par entité
    try {
      // Chambres
      if (next.rooms !== prev.rooms) {
        const added = next.rooms.filter(r => !prev.rooms.find(p => p.id === r.id));
        const removed = prev.rooms.filter(r => !next.rooms.find(p => p.id === r.id));
        const updated = next.rooms.filter(r => prev.rooms.find(p => p.id === r.id && JSON.stringify(p) !== JSON.stringify(r)));

        for (const r of removed) api(`/rooms/${r.id}`, { method: 'DELETE' }).catch(() => {});
        for (const r of added) api('/rooms', { method: 'POST', body: JSON.stringify(r) }).catch(() => {});
        for (const r of updated) api(`/rooms/${r.id}`, { method: 'PUT', body: JSON.stringify(r) }).catch(() => {});
      }

      // Réservations
      if (next.reservations !== prev.reservations) {
        const added = next.reservations.filter(r => !prev.reservations.find(p => p.id === r.id));
        const removed = prev.reservations.filter(r => !next.reservations.find(p => p.id === r.id));
        const updated = next.reservations.filter(r => prev.reservations.find(p => p.id === r.id && JSON.stringify(p) !== JSON.stringify(r)));
        for (const r of removed) api(`/reservations/${r.id}`, { method: 'DELETE' }).catch(() => {});
        for (const r of added) api('/reservations', { method: 'POST', body: JSON.stringify({ ...r, roomId: r.roomId || (prev.rooms.find(pr => pr.number === r.roomNumber) || {}).id }) }).catch(() => {});
        for (const r of updated) api(`/reservations/${r.id}`, { method: 'PUT', body: JSON.stringify(r) }).catch(() => {});
      }

      // Stock
      if (next.stockBoisson !== prev.stockBoisson) {
        for (const item of next.stockBoisson) {
          const p = prev.stockBoisson.find(s => s.id === item.id);
          if (!p) api('/stock', { method: 'POST', body: JSON.stringify({ ...item, category: 'boisson' }) }).catch(() => {});
          else if (JSON.stringify(p) !== JSON.stringify(item)) api(`/stock/${item.id}`, { method: 'PUT', body: JSON.stringify(item) }).catch(() => {});
        }
        for (const item of prev.stockBoisson) {
          if (!next.stockBoisson.find(s => s.id === item.id)) api(`/stock/${item.id}`, { method: 'DELETE' }).catch(() => {});
        }
      }
      if (next.stockNourriture !== prev.stockNourriture) {
        for (const item of next.stockNourriture) {
          const p = prev.stockNourriture.find(s => s.id === item.id);
          if (!p) api('/stock', { method: 'POST', body: JSON.stringify({ ...item, category: 'nourriture' }) }).catch(() => {});
          else if (JSON.stringify(p) !== JSON.stringify(item)) api(`/stock/${item.id}`, { method: 'PUT', body: JSON.stringify(item) }).catch(() => {});
        }
        for (const item of prev.stockNourriture) {
          if (!next.stockNourriture.find(s => s.id === item.id)) api(`/stock/${item.id}`, { method: 'DELETE' }).catch(() => {});
        }
      }

      // Mouvements
      if (next.movements !== prev.movements && next.movements.length > prev.movements.length) {
        const newMoves = next.movements.slice(prev.movements.length);
        for (const m of newMoves) {
          const item = [...next.stockBoisson, ...next.stockNourriture].find(s => s.id === m.itemId || s.name === m.itemName);
          if (item) api(`/stock/${item.id}/movement`, { method: 'POST', body: JSON.stringify({ type: m.type, qty: m.qty, note: m.note || '' }) }).catch(() => {});
        }
      }

      // Utilisateurs
      if (next.users !== prev.users && next.users.length > prev.users.length) {
        const added = next.users.filter(u => !prev.users.find(p => p.username === u.username));
        for (const u of added) api('/users', { method: 'POST', body: JSON.stringify(u) }).catch(() => {});
      }

      // Closed days
      if (next.closedDays !== prev.closedDays && next.closedDays.length > prev.closedDays.length) {
        api('/closed-days', { method: 'POST' }).catch(() => {});
      }

      // Settings
      if (next.settings !== prev.settings) {
        api('/settings', { method: 'PUT', body: JSON.stringify(next.settings) }).catch(() => {});
      }
    } catch (e) {
      console.warn('API sync error:', e);
    }
  }, [data, apiMode]);

  const persist = useCallback(async (next) => {
    setData(next);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(next), true); }
    catch (e) { setStorageError(true); }
    // Sync API en arrière-plan
    syncToApi(next);
  }, [syncToApi]);

  const handleApiLogin = useCallback(async (username, password) => {
    const user = await loginToApi(username, password);
    // Recharger les données depuis l'API après connexion
    try {
      const apiData = await loadAllFromApi();
      setData(apiData);
      await window.storage.set(STORAGE_KEY, JSON.stringify(apiData), true).catch(() => {});
      setApiMode(true);
    } catch (e) {
      console.warn('API data load après login échoué:', e);
    }
    return user;
  }, []);

  const showToast = (msg, kind = 'ok') => { setToast({ msg, kind }); setTimeout(() => setToast(null), 2600); };
  const lowStockItems = data ? getLowStockItems(data) : [];
  const lowStockCount = lowStockItems.length;

  if (loading) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', background: COLORS.paper }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '16px' }}>
        <div style={{ width: '36px', height: '36px', borderRadius: '50%', border: `3px solid ${COLORS.brass}30`, borderTopColor: COLORS.brass, animation: 'spin 0.8s linear infinite' }}></div>
        <div style={{ fontSize: '14px', color: COLORS.slate }}>Chargement…</div>
      </div>
    </div>
  );

  const hotelName = data.settings?.hotelName || 'Villa Blanca';

  // PAGE DE VEILLE
  if (showSplash) {
    return <SplashScreen onEnter={() => setShowSplash(false)} backgroundImage={BACKGROUND_IMAGES[backgroundIndex]} />;
  }

  // PAGE DE CONNEXION
  if (!currentUser) {
    return <LoginScreen users={data.users} onLogin={setCurrentUser} storageError={storageError} hotelName={hotelName} onApiLogin={handleApiLogin} backgroundImage={BACKGROUND_IMAGES[backgroundIndex]} />;
  }

  // APPLICATION PRINCIPALE
  const navItems = [
    { key: 'dashboard', label: 'Tableau de bord', icon: I.LayoutGrid, roles: ['manager'] },
    { key: 'rooms', label: 'Chambres', icon: I.BedDouble, roles: ['manager', 'reception'] },
    { key: 'reservations', label: 'Réservations', icon: I.CalendarCheck, roles: ['manager', 'reception'] },
    { key: 'stock', label: 'Stock', icon: I.Package, roles: ['manager', 'reception'] },
    { key: 'cumuls', label: 'Cumuls', icon: I.ClipboardList, roles: ['manager'] },
    { key: 'cloture', label: 'Clôture', icon: I.Lock, roles: ['manager'] },
    { key: 'users', label: 'Utilisateurs', icon: I.Users, roles: ['manager'] },
    { key: 'settings', label: 'Paramètres', icon: I.Settings, roles: ['manager', 'reception'] },
  ];

  return (
    <div style={{ display: 'flex', height: '100%', background: 'linear-gradient(135deg, #f7fbff 0%, #eaf4ff 55%, #dcecff 100%)' }}>
      {/* Sidebar glass */}
      <div className="glass" style={{ width: '220px', minWidth: '220px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
        padding: '20px 14px', borderRadius: '0 24px 24px 0', margin: '8px 0 8px 8px', background: 'linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(220,236,255,0.86) 100%)' }}>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '28px', paddingLeft: '6px' }}>
            <div style={{ width: '44px', height: '44px', borderRadius: '14px', overflow: 'hidden', background: COLORS.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(255,255,255,0.25)' }}>
              <img src="logo.jpg" alt="Logo Villa Blanca" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
            <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '18px', fontWeight: 700 }}>{hotelName}</span>
          </div>
          <nav style={{ display: 'flex', flexDirection: 'column', gap: '2px' }}>
            {navItems.filter(it => it.roles.includes(currentUser.role)).map(it => {
              const active = view === it.key;
              const IconComp = it.icon;
              return (
                <button key={it.key} onClick={() => setView(it.key)}
                  onMouseEnter={() => setHoveredNav(it.key)}
                  onMouseLeave={() => setHoveredNav(null)}
                  style={{
                  width: '100%', display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 14px', borderRadius: '14px',
                  border: 'none',
                  background: active ? 'rgba(30,27,22,0.06)' : hoveredNav === it.key ? 'rgba(30,27,22,0.04)' : 'transparent',
                  color: active ? COLORS.ink : COLORS.slate, fontWeight: active ? 600 : 400,
                  fontSize: '14px', cursor: 'pointer',
                  transform: hoveredNav === it.key && !active ? 'translateX(3px)' : 'none',
                  transition: 'background 0.2s, transform 0.2s, color 0.15s',
                }}>
                  <IconComp size={18} style={{ color: active ? COLORS.ink : COLORS.slate, opacity: active ? 1 : 0.6 }} />
                  {it.label}
                  {it.key === 'stock' && lowStockCount > 0 && (
                    <span style={{ marginLeft: 'auto', background: COLORS.brick, color: 'white', fontSize: '10px', minWidth: '18px', height: '18px', borderRadius: '20px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>
                      {lowStockCount}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>
        <div style={{ padding: '10px 12px', borderRadius: '16px', background: 'rgba(30,27,22,0.03)' }}>
          <div style={{ fontSize: '12px', marginBottom: '6px', lineHeight: 1.4 }}>
            <div style={{ fontWeight: 500, color: COLORS.ink }}>{currentUser.name}</div>
            <span className="tag" style={{ fontSize: '10px', background: COLORS.brass, color: 'white' }}>{ROLE_LABEL[currentUser.role]}</span>
          </div>
          <button onClick={() => setCurrentUser(null)} style={{ width: '100%', padding: '8px', borderRadius: '12px', border: 'none', background: 'transparent',
            fontSize: '12px', color: COLORS.slate, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px' }}>
            <I.LogOut size={14} /> Déconnexion
          </button>
        </div>
      </div>

      {/* Contenu principal */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, padding: '8px 16px 8px 16px' }}>
        {/* TopBar glass */}
        <div className="glass" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 24px', borderRadius: '24px', marginBottom: '16px' }}>
          <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontSize: '15px', fontWeight: 500 }}>Journée du {formatDateLong(data.currentDay)}</span>
          <span style={{ fontSize: '12px', color: COLORS.slate, display: 'flex', alignItems: 'center', gap: '6px' }}>
            {data.settings.dayBoundary === 'midnight' ? <I.Moon size={13} /> : <I.Sun size={13} />}
            Bascule à {data.settings.dayBoundary === 'midnight' ? 'minuit' : 'midi'}
          </span>
        </div>

        {lowStockCount > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 20px', borderRadius: '16px', background: `rgba(190,60,55,0.08)`, marginBottom: '12px', fontSize: '13px', color: COLORS.brick }}>
            <I.AlertTriangle size={16} />
            <span style={{ flex: 1 }}>{lowStockCount} article{lowStockCount > 1 ? 's' : ''} en dessous du seuil d'alerte</span>
            <button onClick={() => setView('stock')} className="btn-ghost" style={{ fontSize: '12px', color: COLORS.brick, border: `1px solid ${COLORS.brick}40` }}>
              Voir le stock
            </button>
          </div>
        )}

        <div className="view-enter" style={{ flex: 1, overflow: 'auto', paddingBottom: '12px' }}>
          {view === 'dashboard' && <Dashboard data={data} />}
          {view === 'rooms' && <RoomsView data={data} persist={persist} role={currentUser.role} showToast={showToast} />}
          {view === 'reservations' && <ReservationsView data={data} persist={persist} showToast={showToast} />}
          {view === 'stock' && <StockView data={data} persist={persist} role={currentUser.role} showToast={showToast} />}
          {view === 'cumuls' && <CumulsView data={data} />}
          {view === 'cloture' && currentUser.role === 'manager' && <ClotureView data={data} persist={persist} showToast={showToast} currentUser={currentUser} />}
          {view === 'users' && currentUser.role === 'manager' && <UsersView data={data} persist={persist} currentUser={currentUser} showToast={showToast} />}
          {view === 'settings' && <SettingsView data={data} persist={persist} currentUser={currentUser} showToast={showToast} />}
        </div>
      </div>

      {toast && (
        <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 9999, padding: '14px 24px', borderRadius: '18px',
          background: COLORS.ink, color: 'white', fontSize: '14px', boxShadow: '0 12px 40px -8px rgba(0,0,0,0.2)', display: 'flex', alignItems: 'center', gap: '10px' }}>
          {toast.kind === 'error' ? <I.AlertTriangle size={18} /> : <I.CheckCircle2 size={18} />} {toast.msg}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HotelManager />);
</script>
</body>
</html>
